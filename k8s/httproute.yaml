apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: ofd1-forecast
  namespace: ofd1-forecast
spec:
  hostnames:
    - ofd1.lab.jake-watson.co.uk
  parentRefs:
    - name: cilium-gateway-external
      namespace: default
  rules:
    - backendRefs:
        - kind: Service
          name: ofd1-forecast
          port: 80
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: ofd1-forecast
  namespace: ofd1-forecast
spec:
  endpoints:
    - dnsName: ofd1.lab.jake-watson.co.uk
      recordTTL: 300
      recordType: A
      targets:
        - 212.69.47.125
