# Alternative: GitRepository + Kustomization sync (like clusters/my-cluster/apps/foundry-platform/foundry-platform.yaml)
# Reconciles ./k8s directly from your GitHub repository every 5 minutes.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ofd1-forecast
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/you-randomly/ofd1-forecast.git
  ref:
    branch: main
  ignore: |
    # exclude all
    /*
    # include k8s manifests dir
    !/k8s
    /k8s/flux-cd
    /k8s/kind-3node.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ofd1-forecast
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ofd1-forecast
  path: ./k8s
